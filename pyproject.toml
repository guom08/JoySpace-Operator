[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "joyspace-operator"
version = "0.1.0"
description = "Playwright-based automation for JoySpace shared documents"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "rich>=13.0",      # pretty console output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
